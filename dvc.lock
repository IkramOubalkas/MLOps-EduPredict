schema: '2.0'
stages:
  prepare:
    cmd: python src/preprocess.py
    deps:
    - path: data/raw/students.csv
      hash: md5
      md5: ee29c9ee9ea60654b5bb0a161c0a473d
      size: 533230
    - path: src/preprocess.py
      hash: md5
      md5: ebe08884d6d1aaf998ff046379db4493
